<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<footer style="padding:72px 24px 40px;background:#111111;border-top:1px solid #242427;font-family:'Plus Jakarta Sans',sans-serif;color:#FFFFFF">
  <div style="max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:48px">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:40px">
      <div style="display:flex;flex-direction:column;gap:12px">
        <span style="font-size:28px;font-weight:800;letter-spacing:-.8px;line-height:1">IFI</span>
        <span style="font-size:14px;color:#A3A3A8;line-height:1.55;max-width:240px">Koperasi Film Indonesia. Film yang lahir dari kita, untuk kita.</span>
      </div>
      <sc-for list="{{ cols }}" as="col" hint-placeholder-count="4">
        <div style="display:flex;flex-direction:column;gap:12px">
          <span style="font-size:13px;font-weight:600;color:#FFFFFF">{{ col.title }}</span>
          <sc-for list="{{ col.links }}" as="lk"><a href="{{ lk.href }}" style="font-size:15px;color:#A3A3A8;text-decoration:none;min-height:28px;display:flex;align-items:center" style-hover="color:#FFFFFF">{{ lk.label }}</a></sc-for>
        </div>
      </sc-for>
    </div>
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:16px 40px;padding:28px 0;border-top:1px solid #242427;border-bottom:1px solid #242427">
      <span style="font-size:13px;font-weight:600;color:#A3A3A8">Didukung oleh</span>
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px 36px">
        <img src="assets/logo-gv.png" alt="Global Village" style="height:40px;width:auto;display:block">
      <img src="assets/logo-nu.png" alt="Nahdlatul Ulama" style="height:40px;width:auto;display:block">
      <img src="assets/logo-pfn.png" alt="PFN Produksi Film Negara" style="height:40px;width:auto;display:block">
      </div>
    </div>
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px">
      <span style="font-size:13px;color:#A3A3A8">© 2026 Indonesia Films Initiative. Hak cipta dilindungi.</span>
      <div style="display:flex;gap:8px">
        <sc-for list="{{ socials }}" as="so"><a href="#" aria-label="{{ so.name }}" style="width:48px;height:48px;border-radius:999px;background:#1B1B1D;border:1px solid #2F2F33;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#FFFFFF;text-decoration:none" style-hover="background:#242427">{{ so.short }}</a></sc-for>
      </div>
    </div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:420}}">
class Component extends DCLogic {
  renderVals() {
    const L = (label, href) => ({ label, href: href || '#' });
    return {
      cols: [
        { title: 'IFI', links: [L('Tentang', 'Tentang%20IFI.dc.html'), L('Board', 'Tentang%20IFI.dc.html#board'), L('Kontak')] },
        { title: 'Program', links: [L('Membership', 'Membership.dc.html'), L('Festival', 'Festival.dc.html'), L('Course', 'Membership.dc.html#benefit'), L('Investor', 'Investor.dc.html')] },
        { title: 'Komunitas', links: [L('Industry Hub', 'Industry%20Hub.dc.html'), L('Bersama NU', 'IFI%20Homepage%20v2.dc.html#nu')] },
        { title: 'Legal', links: [L('Syarat', 'Legal.dc.html#syarat'), L('Privasi', 'Legal.dc.html#privasi')] }
      ],
      socials: [{ name: 'Instagram', short: 'IG' }, { name: 'TikTok', short: 'TT' }, { name: 'YouTube', short: 'YT' }, { name: 'X', short: 'X' }]
    };
  }
}
</script>
</body>
</html>
