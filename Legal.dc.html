<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style id="ifi-mobile">
@media (max-width:640px){
  :is(div,nav,form,footer):has(> :is(a,button)[style*="height: 52px"] ~ :is(a,button)[style*="height: 52px"]),
  :is(div,nav,form):has(> :is(a,button)[style*="height: 48px"] ~ :is(a,button)[style*="height: 48px"]){display:flex!important;flex-direction:row!important;flex-wrap:nowrap!important;align-items:stretch!important;align-self:stretch!important;width:100%!important;gap:8px!important}
  :is(div,nav,form,footer):has(> :is(a,button)[style*="height: 52px"] ~ :is(a,button)[style*="height: 52px"]) > :is(a,button),
  :is(div,nav,form):has(> :is(a,button)[style*="height: 48px"] ~ :is(a,button)[style*="height: 48px"]) > :is(a,button){flex:1 1 0!important;min-width:0!important;width:auto!important;height:48px!important;padding:0 8px!important;justify-content:center!important;text-align:center!important;font-size:13.5px!important;letter-spacing:-.1px;line-height:1.2!important;white-space:nowrap!important;overflow:hidden;text-overflow:ellipsis}
  :is(a,button)[style*="height: 52px"]{height:48px!important}
  section[data-screen-label] h2{margin-bottom:0!important}
  [data-mcarousel]{display:flex!important;flex-wrap:nowrap!important;overflow-x:auto!important;scroll-snap-type:x mandatory;scrollbar-width:none;gap:12px!important;margin-left:-24px!important;margin-right:-24px!important;padding:0 24px 4px!important;scroll-padding:0 24px}
  [data-mcarousel]::-webkit-scrollbar{display:none}
  [data-mcarousel] > *{flex:0 0 84%!important;min-width:0!important;scroll-snap-align:start}
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#111111;color:#FFFFFF;font-family:'Plus Jakarta Sans',sans-serif;-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
*{box-sizing:border-box}
a{color:#FFFFFF;text-decoration:none}
a:hover{color:#F23A49}
button{font-family:inherit}
</style>
</helmet>

<div style="background:#111111;color:#FFFFFF;font-family:'Plus Jakarta Sans',sans-serif;font-size:clamp(16px,1.25vw,18px);line-height:1.7">
<dc-import name="IFI Navbar" active="" hint-size="100%,1px"></dc-import>

<header style="padding:clamp(140px,14vw,184px) 24px clamp(32px,4vw,56px)">
  <div style="max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:20px">
    <nav aria-label="Breadcrumb" style="display:flex;gap:8px;font-size:14px;color:#A3A3A8"><a href="IFI%20Homepage%20v2.dc.html" style="color:#A3A3A8" style-hover="color:#FFFFFF">Home</a><span>/</span><span style="color:#FFFFFF">Legal</span></nav>
    <h1 style="margin:0;font-weight:800;font-size:clamp(40px,5vw,72px);line-height:1.1;letter-spacing:-1.5px">{{ docTitle }}</h1>
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:16px">
      <div role="tablist" style="display:flex;gap:4px;padding:4px;border-radius:999px;background:#1B1B1D;border:1px solid #2F2F33">
        <sc-for list="{{ docTabs }}" as="t" hint-placeholder-count="2"><button role="tab" aria-selected="{{ t.on }}" onClick="{{ t.onClick }}" style="height:44px;padding:0 20px;border:0;border-radius:999px;background:{{ t.bg }};color:{{ t.color }};font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap">{{ t.label }}</button></sc-for>
      </div>
      <span style="font-size:14px;color:#A3A3A8">Terakhir diperbarui 3 November 2026 · Draf, menunggu tinjauan hukum</span>
    </div>
  </div>
</header>

<div style="max-width:1200px;margin:0 auto;padding:0 24px clamp(72px,9vw,120px);display:grid;grid-template-columns:{{ layoutCols }};gap:clamp(32px,5vw,72px);align-items:start">
  <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
    <nav aria-label="Daftar isi" style="position:sticky;top:104px;padding:20px;border-radius:24px;background:#1B1B1D;border:1px solid #2F2F33;display:flex;flex-direction:column;gap:2px">
      <span style="font-size:13px;font-weight:600;color:#A3A3A8;padding:0 12px 10px">Daftar isi</span>
      <sc-for list="{{ toc }}" as="t" hint-placeholder-count="7"><a href="{{ t.href }}" onClick="{{ t.onClick }}" style="min-height:44px;padding:8px 12px;border-radius:14px;display:flex;align-items:center;gap:10px;font-size:15px;line-height:1.4;color:{{ t.color }};background:{{ t.bg }}" style-hover="background:#242427;color:#FFFFFF"><sc-if value="{{ t.on }}" hint-placeholder-val="{{ false }}"><span style="flex:none;width:6px;height:6px;border-radius:999px;background:#E11D2E"></span></sc-if>{{ t.label }}</a></sc-for>
    </nav>
  </sc-if>
  <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
    <details style="border-radius:20px;background:#1B1B1D;border:1px solid #2F2F33">
      <summary style="min-height:56px;padding:0 20px;display:flex;align-items:center;font-size:16px;font-weight:600;cursor:pointer;list-style:none">Daftar isi</summary>
      <div style="padding:0 12px 12px;display:flex;flex-direction:column"><sc-for list="{{ toc }}" as="t"><a href="{{ t.href }}" style="min-height:48px;padding:8px 8px;display:flex;align-items:center;font-size:16px;color:#D4D4D8;border-top:1px solid #242427">{{ t.label }}</a></sc-for></div>
    </details>
  </sc-if>
  <article style="min-width:0;max-width:720px;display:flex;flex-direction:column;gap:48px">
    <sc-for list="{{ sections }}" as="s" hint-placeholder-count="7">
      <section id="{{ s.id }}" style="scroll-margin-top:110px;display:flex;flex-direction:column;gap:14px">
        <h2 style="margin:0;font-size:24px;font-weight:700;line-height:1.3;letter-spacing:-.3px">{{ s.title }}</h2>
        <sc-for list="{{ s.body }}" as="p"><p style="margin:0;color:#D4D4D8">{{ p }}</p></sc-for>
      </section>
    </sc-for>
    <p style="margin:0;padding:20px 24px;border-radius:20px;background:#1B1B1D;border:1px solid #2F2F33;font-size:15px;color:#A3A3A8">Ada pertanyaan tentang dokumen ini? Hubungi tim IFI lewat halaman Kontak.</p>
  </article>
</div>

<dc-import name="IFI Footer" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { w: 1440, doc: 'syarat', active: '' };
  componentDidMount() {
    this.onResize = () => this.setState({ w: window.innerWidth }); window.addEventListener('resize', this.onResize); this.onResize();
    const h = (window.location.hash || '').replace('#', '');
    if (h === 'privasi') this.setState({ doc: 'privasi' });
    this.onScroll = () => {
      const ids = this.docs()[this.state.doc].sections.map(s => s.id);
      let cur = ids[0];
      for (const id of ids) { const el = document.getElementById(id); if (el && el.getBoundingClientRect().top < 160) cur = id; }
      if (cur !== this.state.active) this.setState({ active: cur });
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); window.removeEventListener('scroll', this.onScroll); }
  docs() {
    return {
      syarat: { title: 'Syarat dan Ketentuan', sections: [
        { id: 's-umum', title: '1. Ketentuan umum', body: ['Dengan mengakses website IFI, kamu menyetujui syarat dan ketentuan ini. Website IFI adalah pintu informasi Koperasi Film Indonesia dan bukan platform streaming.'] },
        { id: 's-member', title: '2. Keanggotaan', body: ['Pendaftaran member, pembayaran iuran, voting, dan course dilakukan di GV Apps. Ketentuan keanggotaan mengikuti anggaran dasar koperasi dan syarat penggunaan GV Apps.'] },
        { id: 's-bayar', title: '3. Pembayaran', body: ['Website IFI tidak memproses pembayaran. Semua transaksi diproses oleh GV Pay di dalam GV Apps.'] },
        { id: 's-festival', title: '4. Festival', body: ['Peserta menjamin karya yang dikirim adalah karya orisinal. Karya ditayangkan lewat embed YouTube atau GV Apps sesuai ketentuan masing-masing festival.'] },
        { id: 's-hub', title: '5. Industry Hub', body: ['Listing tampil setelah disetujui admin. IFI berhak menolak atau menurunkan listing yang tidak sesuai. Kesepakatan sewa lokasi atau kerja sama kru menjadi tanggung jawab para pihak.'] },
        { id: 's-investor', title: '6. Informasi investasi', body: ['Insight Business Facilitator bersifat informasi untuk membantu pertimbangan, bukan jaminan hasil. Setiap keputusan investasi tetap menjadi tanggung jawab investor.'] },
        { id: 's-ubah', title: '7. Perubahan ketentuan', body: ['IFI dapat memperbarui ketentuan ini sewaktu-waktu. Versi terbaru selalu tersedia di halaman ini.'] }
      ] },
      privasi: { title: 'Kebijakan Privasi', sections: [
        { id: 'p-data', title: '1. Data yang kami kumpulkan', body: ['Data yang kamu isi di form website: nama, email, nomor HP, institusi, serta detail dan foto listing Industry Hub.'] },
        { id: 'p-guna', title: '2. Penggunaan data', body: ['Data dipakai untuk memproses listing, meneruskan form minat ke pemilik listing, dan menghubungi calon investor. Kami tidak menjual data pribadi.'] },
        { id: 'p-kontak', title: '3. Perlindungan kontak listing', body: ['Kontak pemilik listing tidak ditampilkan di website. Pesan dari pengunjung diteruskan lewat email.'] },
        { id: 'p-simpan', title: '4. Penyimpanan', body: ['Data disimpan di pusat data di Indonesia sesuai Undang-Undang Perlindungan Data Pribadi.'] },
        { id: 'p-hak', title: '5. Hak kamu', body: ['Kamu bisa meminta akses, perbaikan, atau penghapusan data pribadimu dengan menghubungi tim IFI.'] },
        { id: 'p-analitik', title: '6. Analitik dan cookie', body: ['Kami memakai alat analitik untuk mengukur kunjungan dan klik tombol, termasuk parameter UTM pada link ke GV Apps.'] },
        { id: 'p-ubah', title: '7. Perubahan kebijakan', body: ['Kebijakan ini dapat diperbarui. Perubahan penting akan kami umumkan di website.'] }
      ] }
    };
  }
  renderVals() {
    const desktop = this.state.w >= 960;
    const d = this.docs()[this.state.doc];
    const active = this.state.active || d.sections[0].id;
    return {
      desktop, mobile: !desktop, layoutCols: desktop ? '280px minmax(0,1fr)' : '1fr',
      docTitle: d.title,
      docTabs: [['syarat', 'Syarat dan Ketentuan'], ['privasi', 'Kebijakan Privasi']].map(([k, l]) => ({ label: l, on: k === this.state.doc, bg: k === this.state.doc ? '#FFFFFF' : 'transparent', color: k === this.state.doc ? '#111111' : '#A3A3A8', onClick: () => { this.setState({ doc: k, active: '' }); window.scrollTo({ top: 0 }); } })),
      toc: d.sections.map(s => ({ label: s.title.replace(/^\d+\.\s/, ''), href: '#' + s.id, on: s.id === active, color: s.id === active ? '#FFFFFF' : '#A3A3A8', bg: s.id === active ? '#242427' : 'transparent', onClick: () => this.setState({ active: s.id }) })),
      sections: d.sections
    };
  }
}
</script>
</body>
</html>
